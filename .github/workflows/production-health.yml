name: Production health

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify HTTPS, certificate, and editor shell
        run: |
          body="$(curl --fail --silent --show-error --location --max-time 30 https://quickyresume.com/)"
          grep -q "Quicky Resume" <<<"$body"
